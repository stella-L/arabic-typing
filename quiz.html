<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>아랍어 단어 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;
  --primary:#d97706;--primary-soft:rgba(217,119,6,.16);
  --success:#22c55e;--error:#ef4444;--text:#f0f0f5;--dim:#8888aa;
  --accent:#f59e0b;--r:16px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
body{display:flex;justify-content:center}
.screen{display:none;flex-direction:column;width:100%;max-width:430px;height:100%;height:-webkit-fill-available;overflow-y:auto}
.screen.on{display:flex}
.home-hero{padding:max(56px,calc(var(--sat) + 20px)) 20px 20px;text-align:center}
.home-hero h1{font-size:22px;font-weight:700;margin-bottom:6px}
.home-hero p{color:var(--dim);font-size:13px;line-height:1.6}
.badge{display:inline-block;background:var(--primary);color:#fff;font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px;margin-top:10px}
.sec{padding:0 20px 20px}
.sec-lbl{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.tog{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.tog-btn{flex:1;background:transparent;border:none;color:var(--dim);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;padding:11px 8px;border-radius:9px;transition:all .2s}
.tog-btn.on{background:var(--primary);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:2px solid transparent;color:var(--dim);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;transition:all .2s}
.chip.on{border-color:var(--primary);color:#fbbf24;background:var(--primary-soft)}
.start-sec{padding:0 20px;margin-top:auto;padding-bottom:calc(28px + var(--sab))}
.sel-info{text-align:center;color:var(--dim);font-size:13px;margin-bottom:10px}
.btn-main{width:100%;background:var(--primary);color:#fff;border:none;font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:700;padding:18px;border-radius:var(--r);transition:opacity .2s}
.btn-main:disabled{opacity:.35;cursor:not-allowed}
.btn-sec{width:100%;background:var(--surface);color:var(--text);border:none;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;padding:16px;border-radius:var(--r);margin-top:10px}
.quiz-hdr{display:flex;align-items:center;justify-content:space-between;padding:max(52px,calc(var(--sat) + 12px)) 20px 10px}
.btn-ico{background:var(--surface2);border:none;color:var(--text);font-size:18px;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.mode-badge{background:var(--surface2);color:var(--dim);font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px}
.prog-sec{padding:0 20px 14px}
.prog-bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s ease}
.prog-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.g{color:var(--success);font-weight:700}.r{color:var(--error);font-weight:700}
.quiz-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px 24px}
.q-card{background:var(--surface);border-radius:22px;padding:22px 20px 20px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cat-tag{font-size:11px;font-weight:700;color:#fbbf24;background:var(--primary-soft);padding:4px 12px;border-radius:20px;margin-bottom:16px;letter-spacing:.04em}
.q-label{font-size:12px;color:var(--dim);font-weight:700;margin-bottom:8px}
.q-ar{font-family:'Noto Naskh Arabic',serif;font-size:clamp(40px,13vw,58px);font-weight:700;line-height:1.3;direction:rtl;text-align:center;margin-bottom:8px;word-break:break-word}
.q-meaning{font-size:28px;font-weight:700;line-height:1.45;text-align:center;margin-bottom:8px}
.q-sub{font-size:13px;color:var(--dim);font-weight:700;text-align:center}
.pronun{font-size:14px;color:var(--accent);font-weight:700;text-align:center;margin-top:4px}
.speak-btn{display:flex;align-items:center;gap:6px;background:var(--surface2);border:none;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;padding:9px 18px;border-radius:20px;margin-top:12px;transition:background .2s}
.speak-btn:active{background:var(--primary)}
.speak-btn:disabled{opacity:.45;cursor:not-allowed}
.fav-btn{width:38px;height:38px;border:none;border-radius:12px;background:var(--surface2);color:var(--dim);font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.fav-btn.on{color:#fbbf24;background:rgba(245,158,11,.16)}
.letters-row{display:flex;flex-direction:row-reverse;gap:6px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.l-chip{background:var(--surface2);border-radius:8px;min-width:36px;height:42px;padding:0 6px;display:flex;align-items:center;justify-content:center}
.l-ar{font-family:'Noto Naskh Arabic',serif;font-size:22px;line-height:1}
.choices{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.choice{width:100%;border:2px solid var(--surface2);background:var(--surface);color:var(--text);border-radius:14px;padding:14px 14px;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;line-height:1.4;text-align:left;transition:background .15s,border-color .15s,transform .15s}
.choice:active{transform:scale(.99)}
.choice .ar{font-family:'Noto Naskh Arabic',serif;font-size:25px;direction:rtl;text-align:right;display:block;line-height:1.2}
.choice .ko{display:block}
.choice .pron{display:block;color:var(--accent);font-size:12px;margin-top:4px}
.choice.correct{border-color:var(--success);background:rgba(34,197,94,.16);color:#86efac}
.choice.wrong{border-color:var(--error);background:rgba(239,68,68,.14);color:#fca5a5}
.choice:disabled{cursor:default}
.feedback{min-height:42px;margin-top:12px;text-align:center;font-size:13px;font-weight:700;color:var(--dim)}
.feedback.ok{color:var(--success)}.feedback.no{color:var(--error)}
.next-wrap{padding:0 20px calc(28px + var(--sab))}
.comp-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(56px,calc(var(--sat) + 20px)) 20px calc(40px + var(--sab));text-align:center}
.trophy{font-size:62px;margin-bottom:18px}
.comp-title{font-size:24px;font-weight:700;margin-bottom:8px}
.comp-sub{color:var(--dim);font-size:14px;line-height:1.6;margin-bottom:26px;white-space:pre-line}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:26px}
.sc{background:var(--surface);border-radius:var(--r);padding:18px 12px;text-align:center}
.sc.full{grid-column:span 2}
.sc-num{font-size:30px;font-weight:700;margin-bottom:4px}
.sc-lbl{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sc-num.b{color:var(--primary)}
.empty{color:var(--dim);font-size:13px;line-height:1.6;padding:18px 20px;text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop .2s ease}
</style>
</head>
<body>
<div id="s-home" class="screen on">
  <div class="home-hero">
    <h1>📝 아랍어 단어 퀴즈</h1>
    <p>암기 카드 단어 종류를 골라<br>뜻과 아랍어를 빠르게 확인해요</p>
    <span class="badge" id="total-badge">단어 불러오는 중</span>
  </div>

  <div class="sec">
    <div class="sec-lbl">퀴즈 방향</div>
    <div class="tog">
      <button class="tog-btn on" id="mode-ar" onclick="setMode('ar-ko')">아랍어 → 뜻</button>
      <button class="tog-btn" id="mode-ko" onclick="setMode('ko-ar')">뜻 → 아랍어</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-lbl">문제 수</div>
    <div class="tog">
      <button class="tog-btn on" id="count-10" onclick="setCount(10)">10문제</button>
      <button class="tog-btn" id="count-20" onclick="setCount(20)">20문제</button>
      <button class="tog-btn" id="count-all" onclick="setCount('all')">전체</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-lbl">카테고리</div>
    <div class="chips" id="chips"></div>
    <p class="empty" id="load-error" style="display:none">단어장을 불러오지 못했어요. 로컬 서버에서 열어주세요.</p>
  </div>

  <div class="start-sec">
    <p class="sel-info" id="sel-info">0개 단어 선택됨</p>
    <button class="btn-main" id="btn-start" onclick="startQuiz()" disabled>퀴즈 시작하기 →</button>
    <button class="btn-sec" onclick="location.href='index.html'">홈으로</button>
  </div>
</div>

<div id="s-quiz" class="screen">
  <div class="quiz-hdr">
    <button class="btn-ico" onclick="goHome()">←</button>
    <span class="mode-badge" id="mode-badge">아랍어 → 뜻</span>
    <div style="width:40px"></div>
  </div>
  <div class="prog-sec">
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
    <div class="prog-stats">
      <span id="q-count">1 / 10</span>
      <span><span class="g" id="s-correct">0</span> 정답 &nbsp; <span class="r" id="s-wrong">0</span> 오답</span>
    </div>
  </div>
  <div class="quiz-body">
    <div class="q-card pop" id="q-card">
      <button class="fav-btn" id="q-fav" onclick="toggleFavorite()" type="button" aria-label="즐겨찾기">☆</button>
      <div class="cat-tag" id="q-cat">카테고리</div>
      <div class="q-label" id="q-label">뜻을 고르세요</div>
      <div class="q-ar" id="q-ar" dir="rtl"></div>
      <div class="q-meaning" id="q-meaning"></div>
      <div class="q-sub" id="q-sub"></div>
      <div class="pronun" id="q-pronun"></div>
      <button class="speak-btn" id="q-speak" onclick="speak()" type="button">🔊 듣기</button>
      <div class="letters-row" id="q-letters"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="next-wrap">
    <button class="btn-main" id="btn-next" onclick="nextQuestion()" disabled>다음 문제 →</button>
  </div>
</div>

<div id="s-complete" class="screen">
  <div class="comp-body">
    <div class="trophy" id="trophy">🎉</div>
    <h2 class="comp-title" id="c-title">퀴즈 완료!</h2>
    <p class="comp-sub" id="c-sub"></p>
    <div class="score-grid">
      <div class="sc"><div class="sc-num g" id="c-correct">0</div><div class="sc-lbl">정답</div></div>
      <div class="sc"><div class="sc-num r" id="c-wrong">0</div><div class="sc-lbl">오답</div></div>
      <div class="sc full"><div class="sc-num b" id="c-rate">0%</div><div class="sc-lbl">정답률</div></div>
    </div>
    <button class="btn-main" onclick="startQuiz()">같은 설정으로 다시</button>
    <button class="btn-sec" onclick="goHome()">설정으로 돌아가기</button>
  </div>
</div>

<script>
let words = [];
let cats = [];
let selectedCats = new Set();
let mode = 'ar-ko';
let questionCount = 10;
let quizDeck = [];
let index = 0;
let current = null;
let score = { correct: 0, wrong: 0 };
let answered = false;
let favoriteIds = new Set();
let favoriteOnly = new URLSearchParams(location.search).get('fav') === '1';
const FAVORITE_KEY = 'arabtype.favoriteWordIds';

function $(id){ return document.getElementById(id); }

function normalizeWord(w) {
  return {
    id: w.id,
    arabic: w.arabic,
    transliteration: w.transliteration || '',
    pronun: w.pronunciation_ko || w.pronun || '',
    meaning: w.meaning_ko || w.meaning || '',
    cat: w.category || w.cat || '기타'
  };
}

function loadFavorites() {
  try {
    const saved = JSON.parse(localStorage.getItem(FAVORITE_KEY) || '[]');
    favoriteIds = new Set(Array.isArray(saved) ? saved : []);
  } catch {
    favoriteIds = new Set();
  }
}

function saveFavorites() {
  localStorage.setItem(FAVORITE_KEY, JSON.stringify([...favoriteIds]));
  syncFavoriteButton();
  updateInfo();
}

function toggleFavorite() {
  if (!current || !current.id) return;
  if (favoriteIds.has(current.id)) favoriteIds.delete(current.id);
  else favoriteIds.add(current.id);
  saveFavorites();
}

function syncFavoriteButton() {
  const btn = $('q-fav');
  if (!btn || !current) return;
  const on = favoriteIds.has(current.id);
  btn.className = 'fav-btn' + (on ? ' on' : '');
  btn.textContent = on ? '★' : '☆';
  btn.setAttribute('aria-pressed', String(on));
}

async function init() {
  loadFavorites();
  try {
    const res = await fetch('words.json');
    if (!res.ok) throw new Error('words.json');
    words = (await res.json()).map(normalizeWord).filter(w => w.arabic && w.meaning);
    cats = [...new Set(words.map(w => w.cat))];
    selectedCats = new Set(cats);
    $('total-badge').textContent = favoriteOnly ? `즐겨찾기 ${words.filter(w => favoriteIds.has(w.id)).length}개` : `총 ${words.length}개 단어`;
    renderChips();
    updateInfo();
  } catch (err) {
    $('total-badge').textContent = '단어장 오류';
    $('load-error').style.display = 'block';
  }
}

function renderChips() {
  const el = $('chips');
  el.innerHTML = '';
  const all = document.createElement('button');
  all.id = 'chip-all';
  all.className = 'chip on';
  all.textContent = `전체 ${words.length}`;
  all.onclick = toggleAll;
  el.appendChild(all);
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.id = `chip-${cat}`;
    btn.className = 'chip on';
    btn.textContent = `${cat} ${words.filter(w => w.cat === cat).length}`;
    btn.onclick = () => toggleCat(cat);
    el.appendChild(btn);
  });
}

function toggleAll() {
  if (selectedCats.size === cats.length) selectedCats.clear();
  else selectedCats = new Set(cats);
  syncChips();
  updateInfo();
}

function toggleCat(cat) {
  if (selectedCats.has(cat)) selectedCats.delete(cat);
  else selectedCats.add(cat);
  syncChips();
  updateInfo();
}

function syncChips() {
  $('chip-all').className = 'chip' + (selectedCats.size === cats.length ? ' on' : '');
  cats.forEach(cat => {
    const el = $(`chip-${cat}`);
    if (el) el.className = 'chip' + (selectedCats.has(cat) ? ' on' : '');
  });
}

function getFiltered() {
  return words.filter(w => selectedCats.has(w.cat) && (!favoriteOnly || favoriteIds.has(w.id)));
}

function updateInfo() {
  const cnt = getFiltered().length;
  $('sel-info').textContent = favoriteOnly ? `즐겨찾기 ${cnt}개 선택됨` : `${cnt}개 단어 선택됨`;
  $('btn-start').disabled = cnt < 2;
}

function setMode(nextMode) {
  mode = nextMode;
  $('mode-ar').className = 'tog-btn' + (mode === 'ar-ko' ? ' on' : '');
  $('mode-ko').className = 'tog-btn' + (mode === 'ko-ar' ? ' on' : '');
}

function setCount(count) {
  questionCount = count;
  ['10','20','all'].forEach(v => {
    $(`count-${v}`).className = 'tog-btn' + (String(count) === v ? ' on' : '');
  });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  ['s-home','s-quiz','s-complete'].forEach(s => $(s).classList.toggle('on', s === id));
}

function goHome() {
  showScreen('s-home');
}

function startQuiz() {
  const filtered = getFiltered();
  if (filtered.length < 2) return;
  const limit = questionCount === 'all' ? filtered.length : Math.min(questionCount, filtered.length);
  quizDeck = shuffle(filtered).slice(0, limit);
  index = 0;
  score = { correct: 0, wrong: 0 };
  $('mode-badge').textContent = mode === 'ar-ko' ? '아랍어 → 뜻' : '뜻 → 아랍어';
  showScreen('s-quiz');
  renderQuestion();
}

function renderQuestion() {
  if (index >= quizDeck.length) {
    showComplete();
    return;
  }
  answered = false;
  current = quizDeck[index];
  const pct = Math.round((index / quizDeck.length) * 100);
  $('prog-fill').style.width = `${pct}%`;
  $('q-count').textContent = `${index + 1} / ${quizDeck.length}`;
  $('s-correct').textContent = score.correct;
  $('s-wrong').textContent = score.wrong;
  $('q-cat').textContent = current.cat;
  $('q-card').className = 'q-card pop';
  $('q-label').textContent = mode === 'ar-ko' ? '뜻을 고르세요' : '아랍어를 고르세요';
  $('q-ar').style.display = mode === 'ar-ko' ? 'block' : 'none';
  $('q-meaning').style.display = mode === 'ko-ar' ? 'block' : 'none';
  $('q-ar').textContent = current.arabic;
  $('q-meaning').textContent = current.meaning;
  $('q-speak').style.display = mode === 'ar-ko' ? 'flex' : 'none';
  $('q-speak').disabled = false;
  syncFavoriteButton();
  if (mode === 'ar-ko') {
    showAnswerDetails();
  } else {
    clearAnswerDetails();
  }
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('btn-next').disabled = true;
  $('btn-next').textContent = index === quizDeck.length - 1 ? '결과 보기 →' : '다음 문제 →';
  renderChoices();
}

function renderChoices() {
  const pool = words.filter(w => w.id !== current.id);
  const wrongs = shuffle(pool).slice(0, 3);
  const choices = shuffle([current, ...wrongs]);
  const el = $('choices');
  el.innerHTML = '';
  choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.dataset.id = choice.id;
    if (mode === 'ar-ko') {
      btn.innerHTML = `<span class="ko">${escapeHtml(choice.meaning)}</span>`;
    } else {
      btn.innerHTML = `<span class="ar" dir="rtl">${escapeHtml(choice.arabic)}</span><span class="pron">${escapeHtml(choice.pronun)}</span>`;
    }
    btn.onclick = () => answer(choice.id, btn);
    el.appendChild(btn);
  });
}

function answer(id) {
  if (answered) return;
  answered = true;
  const ok = id === current.id;
  if (ok) score.correct++;
  else score.wrong++;
  [...document.querySelectorAll('.choice')].forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.id === current.id) btn.classList.add('correct');
    else if (btn.dataset.id === id) btn.classList.add('wrong');
  });
  $('feedback').className = 'feedback ' + (ok ? 'ok' : 'no');
  $('feedback').textContent = ok
    ? `정답이에요. ${current.pronun}`
    : `정답은 ${mode === 'ar-ko' ? current.meaning : current.arabic} 입니다.`;
  showAnswerDetails();
  $('q-speak').style.display = 'flex';
  $('q-speak').disabled = false;
  $('s-correct').textContent = score.correct;
  $('s-wrong').textContent = score.wrong;
  $('btn-next').disabled = false;
}

function nextQuestion() {
  if (!answered) return;
  index++;
  renderQuestion();
}

function showComplete() {
  $('prog-fill').style.width = '100%';
  const total = quizDeck.length || 1;
  const rate = Math.round((score.correct / total) * 100);
  $('c-correct').textContent = score.correct;
  $('c-wrong').textContent = score.wrong;
  $('c-rate').textContent = `${rate}%`;
  $('trophy').textContent = rate >= 90 ? '🏆' : rate >= 70 ? '🎉' : '💪';
  $('c-title').textContent = rate >= 90 ? '완벽해요!' : rate >= 70 ? '좋아요!' : '다시 풀어봐요!';
  $('c-sub').textContent = `${total}문제 중 ${score.correct}문제 정답\n선택한 단어 종류로 다시 연습할 수 있어요`;
  showScreen('s-complete');
}

function clearAnswerDetails() {
  $('q-sub').textContent = '';
  $('q-pronun').textContent = '';
  $('q-letters').innerHTML = '';
}

function showAnswerDetails() {
  $('q-sub').textContent = current.transliteration;
  $('q-pronun').textContent = current.pronun ? `한국어 발음: ${current.pronun}` : '';
  $('q-letters').innerHTML = renderLetters(current.arabic);
}

function speak() {
  if (!current) return;
  if (!('speechSynthesis' in window)) {
    alert('음성 재생이 지원되지 않는 브라우저입니다.\nChrome 또는 Safari를 사용해보세요!');
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(current.arabic);
  utterance.lang = 'ar-SA';
  utterance.rate = 0.75;
  utterance.pitch = 1;
  window.speechSynthesis.speak(utterance);
}

function getLetterBreakdown(arabic) {
  const stripped = arabic.replace(/[ً-ٟؐ-ؚ]/g, '');
  return [...stripped].filter(ch => {
    const cp = ch.codePointAt(0);
    return cp >= 0x0621 && cp <= 0x064A;
  });
}

function renderLetters(arabic) {
  return getLetterBreakdown(arabic).map(letter =>
    `<span class="l-chip"><span class="l-ar">${escapeHtml(letter)}</span></span>`
  ).join('');
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}

init();
</script>
